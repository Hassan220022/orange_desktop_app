name: Build macOS Installer

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "AlarmViewer.spec"
      - "requirements.txt"
      - "VERSION"
      - "scripts/build_macos.sh"
      - "scripts/build_macos_installer.sh"
      - "scripts/install_cloudflared.py"
      - "scripts/pyinstaller_entry.py"
      - "scripts/pyi_rth_alarm_app.py"
      - "assets/app_icon.icns"
      - "assets/app_icon.png"
      - ".github/workflows/build-macos-installer.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: macos-local
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Install Python dependencies
        run: |
          uv venv .venv --python python
          uv pip install --python .venv -r requirements.txt pytest
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q -x

      - name: Make scripts executable
        run: chmod +x scripts/build_macos.sh scripts/build_macos_installer.sh

      - name: Build app bundle and DMG
        run: ./scripts/build_macos_installer.sh

      - name: Smoke test app bundle
        run: |
          dist/AlarmViewer.app/Contents/MacOS/AlarmViewer --version
          dist/AlarmViewer.app/Contents/MacOS/AlarmViewer --smoke-test

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmViewer-macos-installer
          path: dist/AlarmViewer-macOS.dmg
          if-no-files-found: error
