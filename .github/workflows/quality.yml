name: Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libxcb-xinerama0 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: |
          mypy --ignore-missing-imports --explicit-package-bases --follow-imports=silent \
            core/ data/ db/ web/ bdt/

      - name: Test (unit + integration)
        run: xvfb-run pytest tests/ -q --ignore=tests/test_e2e_gui_viewer.py --ignore=tests/test_e2e_gui_bdt.py -x

      - name: Test (GUI E2E — offscreen)
        run: xvfb-run pytest tests/test_e2e_gui_viewer.py tests/test_e2e_gui_bdt.py -q -x
