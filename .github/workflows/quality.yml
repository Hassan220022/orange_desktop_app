name: Quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Lint
        run: ruff check . --exit-zero

      - name: Typecheck
        run: mypy --ignore-missing-imports --no-strict-optional core/ data/ db/ web/ llm_tools/

      - name: Test
        run:           pytest tests/ -x
