name: Quality

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and uv
        shell: powershell
        run: .\scripts\ci_setup_windows.ps1

      - name: Install Python dependencies
        shell: powershell
        run: |
          uv venv .venv --python python
          uv pip install --python .venv -r requirements.txt ruff mypy pytest
          "$PWD\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Lint
        shell: powershell
        run: python -m ruff check .

      - name: Typecheck
        shell: powershell
        run: |
          python -m mypy --ignore-missing-imports --explicit-package-bases --follow-imports=silent core/ data/ db/ web/ bdt/

      - name: Test (unit + integration)
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q --ignore=tests/test_e2e_gui_viewer.py --ignore=tests/test_e2e_gui_bdt.py -x
