name: Quality

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libxcb-xinerama0 libegl1

      - name: Install Python dependencies
        run: |
          uv venv .venv --python python
          uv pip install --python .venv -r requirements.txt ruff mypy pytest
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: python -m ruff check .

      - name: Typecheck
        run: |
          python -m mypy --ignore-missing-imports --explicit-package-bases --follow-imports=silent \
            core/ data/ db/ web/ bdt/

      - name: Test (unit + integration)
        run: xvfb-run python -m pytest tests/ -q --ignore=tests/test_e2e_gui_viewer.py --ignore=tests/test_e2e_gui_bdt.py -x

      - name: Test (GUI E2E — offscreen)
        run: xvfb-run python -m pytest tests/test_e2e_gui_viewer.py tests/test_e2e_gui_bdt.py -q -x
