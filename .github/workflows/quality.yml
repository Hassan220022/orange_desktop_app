name: Quality

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-k3s
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Install Python dependencies
        shell: powershell
        run: |
          uv python install 3.11
          uv venv .venv --python 3.11
          uv pip install --python .venv -r requirements.txt ruff mypy pytest
          "$PWD\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Lint
        shell: powershell
        run: python -m ruff check .

      - name: Typecheck
        shell: powershell
        run: |
          python -m mypy --ignore-missing-imports --explicit-package-bases --follow-imports=silent core/ data/ db/ web/ bdt/

      - name: Test (unit + integration)
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q --ignore=tests/test_e2e_gui_viewer.py --ignore=tests/test_e2e_gui_bdt.py -x
