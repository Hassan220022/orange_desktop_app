name: Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libxcb-xinerama0 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy --ignore-missing-imports core/ data/ db/

      - name: Test
        run: cd /home/runner/work/orange_desktop_app/orange_desktop_app && xvfb-run pytest tests/ --ignore=tests/test_alarm_cache_ui.py --ignore=tests/test_chat_panel.py --ignore=tests/test_viewer_sidebar_constraints.py -x
