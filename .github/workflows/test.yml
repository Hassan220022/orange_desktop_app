name: Tests

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test Linux
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"

      - name: Install dependencies
        run: make ci-install

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: make ci-test

  test-windows:
    name: Test Windows
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and uv
        shell: powershell
        run: .\scripts\ci_setup_windows.ps1

      - name: Install make
        shell: powershell
        run: choco install make -y --no-progress

      - name: Install dependencies
        shell: powershell
        run: make ci-install

      - name: Run tests
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: make ci-test
