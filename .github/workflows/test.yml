name: Tests

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Windows
    runs-on: windows-k3s
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and uv
        shell: powershell
        run: .\scripts\ci_setup_windows.ps1

      - name: Install Python dependencies
        shell: powershell
        run: |
          uv venv .venv --python python
          uv pip install --python .venv -r requirements.txt pytest
          "$PWD\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Run tests
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -q --ignore=tests/test_e2e_gui_viewer.py --ignore=tests/test_e2e_gui_bdt.py -x
