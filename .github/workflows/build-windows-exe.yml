name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'main.py'
      - 'viewer.py'
      - 'parsers.py'
      - 'models.py'
      - 'backup_time.py'
      - 'bdt_parser.py'
      - 'bdt_validator.py'
      - 'constants.py'
      - 'styles.py'
      - 'state.py'
      - 'requirements.txt'
      - 'scripts/pyinstaller_entry.py'
      - '.github/workflows/build-windows-exe.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pandas numpy openpyxl xlrd pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name AlarmViewer `
            --distpath dist `
            --workpath build `
            --specpath . `
            --hidden-import pandas `
            --hidden-import openpyxl `
            --hidden-import xlrd `
            scripts/pyinstaller_entry.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmViewer-windows-exe
          path: dist/AlarmViewer.exe
          if-no-files-found: error
