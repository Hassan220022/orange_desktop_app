name: Build Windows Bundle (Internal)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "scripts/pyinstaller_entry.py"
      - "assets/app_icon.ico"
      - "assets/app_icon.png"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build app bundle
        shell: pwsh
        run: |
          pyinstaller --noconfirm AlarmViewer.spec

      - name: Smoke test bundled app
        shell: pwsh
        run: |
          dist\AlarmViewer\AlarmViewer.exe --version
          dist\AlarmViewer\AlarmViewer.exe --smoke-test

      - name: Zip internal bundle
        shell: pwsh
        run: Compress-Archive -Path dist\AlarmViewer\* -DestinationPath dist\AlarmViewer-windows-bundle.zip -Force

      - name: Upload internal bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmViewer-windows-bundle-internal
          path: dist/AlarmViewer-windows-bundle.zip
          if-no-files-found: error
