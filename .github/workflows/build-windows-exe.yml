name: Build Windows Bundle (Internal)

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "AlarmViewer.spec"
      - "requirements.txt"
      - "VERSION"
      - "scripts/install_cloudflared.py"
      - "scripts/pyinstaller_entry.py"
      - "scripts/pyi_rth_alarm_app.py"
      - "assets/app_icon.ico"
      - "assets/app_icon.png"
      - ".github/workflows/build-windows-exe.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-k3s
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Install build dependencies
        shell: powershell
        run: |
          uv python install 3.11
          uv venv .venv --python 3.11
          uv pip install --python .venv -r requirements.txt pytest
          "$PWD\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Run tests before packaging
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -q --ignore=tests/test_e2e_gui_viewer.py --ignore=tests/test_e2e_gui_bdt.py -x

      - name: Bundle cloudflared
        shell: powershell
        run: python scripts/install_cloudflared.py

      - name: Build app bundle
        shell: powershell
        run: |
          pyinstaller --noconfirm AlarmViewer.spec

      - name: Smoke test bundled app
        shell: powershell
        run: |
          dist\AlarmViewer\AlarmViewer.exe --version
          dist\AlarmViewer\AlarmViewer.exe --smoke-test

      - name: Zip internal bundle
        shell: powershell
        run: Compress-Archive -Path dist\AlarmViewer\* -DestinationPath dist\AlarmViewer-windows-bundle.zip -Force

      - name: Upload internal bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmViewer-windows-bundle-internal
          path: dist/AlarmViewer-windows-bundle.zip
          if-no-files-found: error
