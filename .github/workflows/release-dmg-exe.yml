name: Release macOS App + Windows EXE

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from constants.py
        id: ver
        run: |
          VERSION=$(python3 -c "
          import re, sys
          for line in open('constants.py'):
              m = re.match(r'APP_VERSION\s*=\s*[\"\']([\d.]+)[\"\']\s*$', line)
              if m:
                  print(m.group(1))
                  sys.exit(0)
          sys.exit(1)
          ")
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release for version ${VERSION}"

  build-windows-exe:
    runs-on: windows-latest
    needs: read-version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name AlarmViewer `
            --icon assets/app_icon.ico `
            --add-data "assets/app_icon.png;assets" `
            --paths . `
            --distpath dist `
            --workpath build `
            --specpath . `
            --hidden-import pandas `
            --hidden-import openpyxl `
            --hidden-import xlrd `
            --hidden-import pyarrow `
            --hidden-import python_calamine `
            scripts/pyinstaller_entry.py

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-exe
          path: dist/AlarmViewer.exe
          if-no-files-found: error

  build-macos-app:
    runs-on: macos-14
    needs: read-version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make scripts executable
        run: chmod +x scripts/build_macos.sh

      - name: Build app bundle
        run: ./scripts/build_macos.sh

      - name: Zip macOS app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/AlarmViewer.app dist/AlarmViewer-macOS-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-app
          path: dist/AlarmViewer-macOS-app.zip
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [read-version, build-windows-exe, build-macos-app]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: meta
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          TAG_NAME="build-${RUN_ID}"
          RELEASE_NAME="Alarm Viewer v${VERSION} (${SHORT_SHA})"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows-exe
          path: release-assets

      - name: Download macOS app artifact
        uses: actions/download-artifact@v4
        with:
          name: release-macos-app
          path: release-assets

      - name: Build release notes
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          {
            echo "## Alarm Viewer ${TAG_NAME}"
            echo
            echo "Commit: \`${SHORT_SHA}\`"
            echo
            echo "### Release assets"
            echo "- AlarmViewer.exe (Windows)"
            echo "- AlarmViewer-macOS-app.zip (macOS app bundle)"
            echo
            echo "### Included commits"
            echo
            git log --no-merges --pretty='- %s' -n 30
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/AlarmViewer.exe
            release-assets/AlarmViewer-macOS-app.zip
          fail_on_unmatched_files: true
          make_latest: true
