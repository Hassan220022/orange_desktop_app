name: Release DMG + EXE

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.6)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name AlarmViewer `
            --icon assets/app_icon.ico `
            --add-data "assets/app_icon.png;assets" `
            --paths . `
            --distpath dist `
            --workpath build `
            --specpath . `
            --hidden-import pandas `
            --hidden-import openpyxl `
            --hidden-import xlrd `
            --hidden-import pyarrow `
            --hidden-import python_calamine `
            main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-exe
          path: dist/AlarmViewer.exe
          if-no-files-found: error

  build-macos-dmg:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make scripts executable
        run: chmod +x scripts/build_macos.sh scripts/build_macos_installer.sh

      - name: Build app bundle and DMG
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/build_macos_installer.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-dmg
          path: dist/AlarmViewer-macOS.dmg
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows-exe, build-macos-dmg]
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows-exe
          path: release-assets

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: release-macos-dmg
          path: release-assets

      - name: Build release notes
        env:
          TAG_NAME: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          PREV_TAG="$(git tag --sort=-creatordate | grep -v "^${TAG_NAME}$" | head -n 1 || true)"
          {
            echo "## Alarm Viewer ${TAG_NAME}"
            echo
            echo "### Release assets"
            echo "- AlarmViewer.exe (Windows)"
            echo "- AlarmViewer-macOS.dmg (macOS)"
            echo
            echo "### Full update list"
            if [ -n "${PREV_TAG}" ]; then
              echo
              echo "**Changes since ${PREV_TAG}:**"
              git log --no-merges --pretty='- %h %s' "${PREV_TAG}..HEAD"
              echo
              echo "**Files changed:**"
              git diff --name-only "${PREV_TAG}..HEAD" | sed 's/^/- /'
            else
              echo
              echo "Initial release from this workflow."
              echo
              echo "**Included commits:**"
              git log --no-merges --pretty='- %h %s'
            fi
          } > RELEASE_NOTES.md

      - name: Publish GitHub release (EXE + DMG only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/AlarmViewer.exe
            release-assets/AlarmViewer-macOS.dmg
          fail_on_unmatched_files: true
