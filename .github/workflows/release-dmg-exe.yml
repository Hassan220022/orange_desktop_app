name: Release Installers

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "VERSION"

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare-version:
    runs-on: orange-linux
    timeout-minutes: 10
    outputs:
      version: ${{ steps.read.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"

      - name: Read current app version
        id: read
        run: |
          VERSION=$(python scripts/print_version.py)
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release for version ${VERSION}"

  build-windows-installer:
    runs-on: windows-k3s
    needs: prepare-version
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: |
          Set-Content -Path VERSION -Value "${{ needs.prepare-version.outputs.version }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          uv venv .venv --python python
          uv pip install --python .venv -r requirements.txt pytest
          "$PWD\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Run tests before packaging
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -q --ignore=tests/test_e2e_gui_viewer.py --ignore=tests/test_e2e_gui_bdt.py -x

      - name: Bundle cloudflared
        shell: pwsh
        run: python scripts/install_cloudflared.py

      - name: Build Windows app bundle
        shell: pwsh
        run: |
          pyinstaller --noconfirm AlarmViewer.spec

      - name: Smoke test bundled app
        shell: pwsh
        run: |
          dist\AlarmViewer\AlarmViewer.exe --version
          dist\AlarmViewer\AlarmViewer.exe --smoke-test

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: iscc /DMyAppVersion=${{ needs.prepare-version.outputs.version }} installer/windows/AlarmViewer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer
          path: dist/AlarmViewer-Setup.exe
          if-no-files-found: error

  build-macos-installer:
    runs-on: macos-local
    needs: prepare-version
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        run: printf '%s\n' '${{ needs.prepare-version.outputs.version }}' > VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          uv venv .venv --python python
          uv pip install --python .venv -r requirements.txt pytest
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q -x

      - name: Make scripts executable
        run: chmod +x scripts/build_macos.sh scripts/build_macos_installer.sh

      - name: Build app bundle and DMG
        run: ./scripts/build_macos_installer.sh

      - name: Smoke test app bundle
        run: |
          dist/AlarmViewer.app/Contents/MacOS/AlarmViewer --version
          dist/AlarmViewer.app/Contents/MacOS/AlarmViewer --smoke-test

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-installer
          path: dist/AlarmViewer-macOS.dmg
          if-no-files-found: error

  publish-release:
    runs-on: orange-linux
    needs: [prepare-version, build-windows-installer, build-macos-installer]
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: meta
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          TAG_NAME="v${VERSION}"
          RELEASE_NAME="Alarm Viewer v${VERSION} (${SHORT_SHA})"
          {
            echo "tag=${TAG_NAME}"
            echo "name=${RELEASE_NAME}"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows-installer
          path: release-assets

      - name: Download macOS installer artifact
        uses: actions/download-artifact@v4
        with:
          name: release-macos-installer
          path: release-assets

      - name: Build release notes
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          {
            echo "## Alarm Viewer ${TAG_NAME}"
            echo
            echo "Commit: \`${SHORT_SHA}\`"
            echo
            echo "### Release assets"
            echo "- AlarmViewer-Setup.exe (Windows installer)"
            echo "- AlarmViewer-macOS.dmg (macOS installer)"
            echo
            echo "### Included commits"
            echo
            git log --no-merges --pretty='- %s' -n 30
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/AlarmViewer-Setup.exe
            release-assets/AlarmViewer-macOS.dmg
          fail_on_unmatched_files: true
          make_latest: true
