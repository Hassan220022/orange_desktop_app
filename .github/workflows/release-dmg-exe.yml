name: Release Installers

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Read current app version
        id: read
        run: |
          VERSION=$(python3 scripts/print_version.py)
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release for version ${VERSION}"

  build-windows-installer:
    runs-on: windows-latest
    needs: prepare-version
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: |
          Set-Content -Path VERSION -Value "${{ needs.prepare-version.outputs.version }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests before packaging
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -q --ignore=tests/test_e2e_gui_viewer.py --ignore=tests/test_e2e_gui_bdt.py -x

      - name: Build Windows app bundle
        shell: pwsh
        run: |
          pyinstaller --noconfirm AlarmViewer.spec

      - name: Smoke test bundled app
        shell: pwsh
        run: |
          dist\AlarmViewer\AlarmViewer.exe --version
          dist\AlarmViewer\AlarmViewer.exe --smoke-test

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: iscc /DMyAppVersion=${{ needs.prepare-version.outputs.version }} installer/windows/AlarmViewer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer
          path: dist/AlarmViewer-Setup.exe
          if-no-files-found: error

  build-macos-installer:
    runs-on: macos-14
    needs: prepare-version
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        run: printf '%s\n' '${{ needs.prepare-version.outputs.version }}' > VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q -x

      - name: Make scripts executable
        run: chmod +x scripts/build_macos.sh scripts/build_macos_installer.sh

      - name: Build app bundle and DMG
        run: ./scripts/build_macos_installer.sh

      - name: Smoke test app bundle
        run: |
          dist/AlarmViewer.app/Contents/MacOS/AlarmViewer --version
          dist/AlarmViewer.app/Contents/MacOS/AlarmViewer --smoke-test

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-installer
          path: dist/AlarmViewer-macOS.dmg
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [prepare-version, build-windows-installer, build-macos-installer]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: meta
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          TAG_NAME="v${VERSION}"
          RELEASE_NAME="Alarm Viewer v${VERSION} (${SHORT_SHA})"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows-installer
          path: release-assets

      - name: Download macOS installer artifact
        uses: actions/download-artifact@v4
        with:
          name: release-macos-installer
          path: release-assets

      - name: Build release notes
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          {
            echo "## Alarm Viewer ${TAG_NAME}"
            echo
            echo "Commit: \`${SHORT_SHA}\`"
            echo
            echo "### Release assets"
            echo "- AlarmViewer-Setup.exe (Windows installer)"
            echo "- AlarmViewer-macOS.dmg (macOS installer)"
            echo
            echo "### Included commits"
            echo
            git log --no-merges --pretty='- %s' -n 30
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/AlarmViewer-Setup.exe
            release-assets/AlarmViewer-macOS.dmg
          fail_on_unmatched_files: true
          make_latest: true

  bump-next-version:
    runs-on: ubuntu-latest
    needs: [prepare-version, publish-release]
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump VERSION to next patch
        id: bump
        env:
          CURRENT_VERSION: ${{ needs.prepare-version.outputs.version }}
        run: |
          NEXT_VERSION=$(python3 - <<'PY'
          import os
          import re

          current = os.environ["CURRENT_VERSION"].strip()
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", current)
          if not match:
              raise SystemExit(f"Invalid current version: {current}")
          major, minor, patch = map(int, match.groups())
          print(f"{major}.{minor}.{patch + 1}")
          PY
          )
          printf '%s\n' "$NEXT_VERSION" > VERSION
          echo "value=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit next development version
        env:
          NEXT_VERSION: ${{ steps.bump.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${NEXT_VERSION} [skip ci]"
          git push
