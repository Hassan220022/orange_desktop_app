name: Release DMG + EXE

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "constants.py"
      - "**/*.py"
      - "requirements.txt"
      - "assets/app_icon.ico"
      - "assets/app_icon.icns"
      - "assets/app_icon.png"
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.value }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from constants.py
        id: ver
        run: |
          VERSION=$(python3 -c "
          import re, sys
          for line in open('constants.py'):
              m = re.match(r'APP_VERSION\s*=\s*[\"\']([\d.]+)[\"\']\s*$', line)
              if m:
                  print(m.group(1))
                  sys.exit(0)
          sys.exit(1)
          ")
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"  >> "$GITHUB_OUTPUT"
          echo "Building release for version ${VERSION}"

  build-windows-exe:
    runs-on: windows-latest
    needs: read-version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name AlarmViewer `
            --icon assets/app_icon.ico `
            --add-data "assets/app_icon.png;assets" `
            --paths .. `
            --collect-submodules alarm_app `
            --distpath dist `
            --workpath build `
            --specpath . `
            --hidden-import pandas `
            --hidden-import openpyxl `
            --hidden-import xlrd `
            --hidden-import pyarrow `
            --hidden-import python_calamine `
            scripts/pyinstaller_entry.py

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-exe
          path: dist/AlarmViewer.exe
          if-no-files-found: error

  build-macos-dmg:
    runs-on: macos-14
    needs: read-version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make scripts executable
        run: chmod +x scripts/build_macos.sh scripts/build_macos_installer.sh

      - name: Build app bundle and DMG
        run: ./scripts/build_macos_installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-dmg
          path: dist/AlarmViewer-macOS.dmg
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [read-version, build-windows-exe, build-macos-dmg]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows-exe
          path: release-assets

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: release-macos-dmg
          path: release-assets

      - name: Build release notes
        env:
          TAG_NAME: ${{ needs.read-version.outputs.tag }}
        run: |
          set -euo pipefail
          PREV_TAG="$(git tag --sort=-creatordate | head -n 1 || true)"
          {
            echo "## Alarm Viewer ${TAG_NAME}"
            echo
            echo "### Release assets"
            echo "- AlarmViewer.exe (Windows)"
            echo "- AlarmViewer-macOS.dmg (macOS)"
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "### Changes since ${PREV_TAG}"
              echo
              git log --no-merges --pretty='- %s' "${PREV_TAG}..HEAD"
            else
              echo "### Included commits"
              echo
              git log --no-merges --pretty='- %s'
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.read-version.outputs.tag }}
          name: Alarm Viewer ${{ needs.read-version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/AlarmViewer.exe
            release-assets/AlarmViewer-macOS.dmg
          fail_on_unmatched_files: true
          make_latest: true
