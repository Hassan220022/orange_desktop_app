name: Release Installers

permissions:
  contents: read

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare-version:
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 10
    outputs:
      version: ${{ steps.read.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python and uv
        shell: powershell
        run: .\scripts\ci_setup_windows.ps1

      - name: Fetch tags
        shell: powershell
        run: |
          git fetch --tags --force

      - name: Read current app version
        id: read
        shell: powershell
        run: |
          $version = (python scripts/next_release_version.py).Trim()
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Computed invalid release version: '$version'"
          }

          $existingTag = git tag --list "v$version"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($existingTag) {
            throw "Computed release tag v$version already exists"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "Building release for version $version"

  build-windows-installer:
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    needs: prepare-version
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        shell: powershell
        run: |
          Set-Content -Path VERSION -Value "${{ needs.prepare-version.outputs.version }}"

      - name: Setup Python and uv
        shell: powershell
        run: .\scripts\ci_setup_windows.ps1

      - name: Install dependencies
        shell: powershell
        run: |
          uv venv .venv --python python
          uv pip install --python .venv -r requirements.txt pytest
          "$PWD\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Run tests before packaging
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -q --ignore=tests/test_e2e_gui_viewer.py --ignore=tests/test_e2e_gui_bdt.py -x

      - name: Bundle cloudflared
        shell: powershell
        run: python scripts/install_cloudflared.py

      - name: Build Windows app bundle
        shell: powershell
        run: |
          pyinstaller --noconfirm AlarmViewer.spec

      - name: Smoke test bundled app
        shell: powershell
        run: |
          dist\AlarmViewer\AlarmViewer.exe --version
          dist\AlarmViewer\AlarmViewer.exe --smoke-test

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: powershell
        run: iscc /DMyAppVersion=${{ needs.prepare-version.outputs.version }} installer/windows/AlarmViewer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer
          path: dist/AlarmViewer-Setup.exe
          if-no-files-found: error

  publish-release:
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    needs: [prepare-version, build-windows-installer]
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: meta
        shell: powershell
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          $shortSha = $env:SHA.Substring(0, 7)
          $tagName = "v$env:VERSION"
          $releaseName = "Alarm Viewer v$env:VERSION ($shortSha)"
          "tag=$tagName" >> $env:GITHUB_OUTPUT
          "name=$releaseName" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows-installer
          path: release-assets

      - name: Build release notes
        shell: powershell
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          $commits = git log --no-merges --pretty='- %s' -n 30
          @(
            "## Alarm Viewer $env:TAG_NAME"
            ""
            "Commit: ``$env:SHORT_SHA``"
            ""
            "### Release assets"
            "- AlarmViewer-Setup.exe (Windows installer)"
            ""
            "### Included commits"
            ""
            $commits
          ) | Set-Content -Path RELEASE_NOTES.md
          Get-Content RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/AlarmViewer-Setup.exe
          fail_on_unmatched_files: true
          make_latest: true
