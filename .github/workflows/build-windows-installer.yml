name: Build Windows Installer

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name AlarmViewer `
            --icon assets/app_icon.ico `
            --add-data "assets/app_icon.png;assets" `
            --paths .. `
            --collect-submodules alarm_app `
            --distpath dist `
            --workpath build `
            --specpath . `
            --hidden-import pandas `
            --hidden-import openpyxl `
            --hidden-import xlrd `
            --hidden-import pyarrow `
            --hidden-import python_calamine `
            scripts/pyinstaller_entry.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: iscc installer/windows/AlarmViewer.iss

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmViewer-windows-installer
          path: dist/AlarmViewer-Setup.exe
          if-no-files-found: error

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmViewer-windows-exe
          path: dist/AlarmViewer.exe
          if-no-files-found: error
