name: Build Windows Installer

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract app version
        id: ver
        shell: pwsh
        run: |
          $version = python scripts/print_version.py
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows app bundle
        shell: pwsh
        run: |
          pyinstaller --noconfirm AlarmViewer.spec

      - name: Smoke test bundled app
        shell: pwsh
        run: |
          dist\AlarmViewer\AlarmViewer.exe --version
          dist\AlarmViewer\AlarmViewer.exe --smoke-test

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: iscc /DMyAppVersion=${{ steps.ver.outputs.value }} installer/windows/AlarmViewer.iss

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmViewer-windows-installer
          path: dist/AlarmViewer-Setup.exe
          if-no-files-found: error
