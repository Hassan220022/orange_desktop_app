name: Build Windows Installer

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-k3s
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and uv
        shell: powershell
        run: .\scripts\ci_setup_windows.ps1

      - name: Extract app version
        id: ver
        shell: powershell
        run: |
          $version = python scripts/print_version.py
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        shell: powershell
        run: |
          uv venv .venv --python python
          uv pip install --python .venv -r requirements.txt pytest
          "$PWD\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Run tests before packaging
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -q --ignore=tests/test_e2e_gui_viewer.py --ignore=tests/test_e2e_gui_bdt.py -x

      - name: Bundle cloudflared
        shell: powershell
        run: python scripts/install_cloudflared.py

      - name: Build Windows app bundle
        shell: powershell
        run: |
          pyinstaller --noconfirm AlarmViewer.spec

      - name: Smoke test bundled app
        shell: powershell
        run: |
          dist\AlarmViewer\AlarmViewer.exe --version
          dist\AlarmViewer\AlarmViewer.exe --smoke-test

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: iscc /DMyAppVersion=${{ steps.ver.outputs.value }} installer/windows/AlarmViewer.iss

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmViewer-windows-installer
          path: dist/AlarmViewer-Setup.exe
          if-no-files-found: error
