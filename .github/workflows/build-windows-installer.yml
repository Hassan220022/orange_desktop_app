name: Build Windows Installer

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Extract app version
        id: ver
        shell: pwsh
        run: |
          $version = python scripts/print_version.py
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        shell: pwsh
        run: |
          uv venv .venv --python python
          uv pip install --python .venv -r requirements.txt pytest
          "$PWD\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Run tests before packaging
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -q --ignore=tests/test_e2e_gui_viewer.py --ignore=tests/test_e2e_gui_bdt.py -x

      - name: Bundle cloudflared
        shell: pwsh
        run: python scripts/install_cloudflared.py

      - name: Build Windows app bundle
        shell: pwsh
        run: |
          pyinstaller --noconfirm AlarmViewer.spec

      - name: Smoke test bundled app
        shell: pwsh
        run: |
          dist\AlarmViewer\AlarmViewer.exe --version
          dist\AlarmViewer\AlarmViewer.exe --smoke-test

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: iscc /DMyAppVersion=${{ steps.ver.outputs.value }} installer/windows/AlarmViewer.iss

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmViewer-windows-installer
          path: dist/AlarmViewer-Setup.exe
          if-no-files-found: error
